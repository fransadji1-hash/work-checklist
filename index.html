<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WORK CHECKLIST</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#17202a}header{background:#111827;color:#fff;padding:16px 20px;display:flex;justify-content:space-between}main{max-width:1100px;margin:24px auto;padding:0 16px}.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 2px 12px #0001}input,textarea,select,button{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:9px;font-size:15px;margin:6px 0}button{background:#111827;color:white;border:0;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.stat{font-size:28px;font-weight:bold}.muted{color:#6b7280}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#e5e7eb;font-size:12px}.hidden{display:none}.login{max-width:420px;margin:10vh auto}.item{border:1px solid #e5e7eb;padding:14px;border-radius:10px;margin:8px 0}nav button{width:auto;margin-right:6px}@media(max-width:600px){nav button{width:100%;margin:4px 0}}</style></head><body>
<div id="loginPage" class="login card"><h1>WORK CHECKLIST</h1><p class="muted">Login online</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="loginBtn">Masuk</button><p id="loginMsg"></p></div>
<div id="app" class="hidden"><header><b>WORK CHECKLIST</b><button id="logoutBtn" style="width:auto">Keluar</button></header><main>
<nav class="card"><button onclick="show('dashboard')">Dashboard</button><button onclick="show('jobs')">Jobs</button><button onclick="show('add')">Tambah Job</button><button onclick="show('history')">History</button><button onclick="show('users')">Users</button></nav>
<section id="dashboard"><h2>Dashboard</h2><div class="grid"><div class="card">Total<div id="total" class="stat">0</div></div><div class="card">Pending<div id="pending" class="stat">0</div></div><div class="card">In Progress<div id="progress" class="stat">0</div></div><div class="card">Completed<div id="completed" class="stat">0</div></div></div><div class="card"><h3>Job Terbaru</h3><div id="latest"></div></div></section>
<section id="jobs" class="hidden"><h2>Jobs</h2><div class="card"><input id="search" placeholder="Cari job..."><div id="jobList"></div></div></section>
<section id="add" class="hidden"><h2>Tambah Job</h2><div class="card"><input id="title" placeholder="Judul pekerjaan"><textarea id="desc" placeholder="Deskripsi"></textarea><select id="priority"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option><option value="urgent">Urgent</option></select><input id="taskDate" type="date"><input id="deadline" type="datetime-local"><textarea id="notes" placeholder="Catatan"></textarea><button id="addBtn">Simpan Job</button><p id="addMsg"></p></div></section>
<section id="history" class="hidden"><h2>History Completed</h2><div class="card"><div id="historyList"></div></div></section><section id="users" class="hidden"><h2>Users</h2><div class="card"><div id="userList"></div></div></section></main></div>
<script>
const SUPABASE_URL="https://qsyjeopxnkduchlincgk.supabase.co",SUPABASE_KEY="sb_publishable_19CluHxWcACDvCfX8CaEuA_TunEEgK1",client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let me=null,jobs=[],profiles=[];
const $=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function show(id){["dashboard","jobs","add","history","users"].forEach(x=>$(x).classList.toggle("hidden",x!==id));if(id==="dashboard")renderDashboard();if(id==="jobs")renderJobs();if(id==="history")renderHistory();if(id==="users")renderUsers()}
async function load(){let p=await client.from("profiles").select("*").order("full_name");profiles=p.data||[];let t=await client.from("tasks").select("*").order("created_at",{ascending:false});jobs=t.data||[]}
async function enter(u){me=u;$("loginPage").classList.add("hidden");$("app").classList.remove("hidden");await load();show("dashboard")}
function card(x){return `<div class="item"><b>${esc(x.job_code)} — ${esc(x.title)}</b><br><span class="badge">${x.status}</span> <span class="badge">${x.priority}</span><p>${esc(x.description||"")}</p>${x.status==="pending"?`<button onclick="startJob('${x.id}')">Mulai Job</button>`:""}${x.status==="in_progress"?`<button onclick="completeJob('${x.id}')">Selesaikan Job</button>`:""}</div>`}
function renderDashboard(){$("total").textContent=jobs.length;$("pending").textContent=jobs.filter(x=>x.status==="pending").length;$("progress").textContent=jobs.filter(x=>x.status==="in_progress").length;$("completed").textContent=jobs.filter(x=>x.status==="completed").length;$("latest").innerHTML=jobs.slice(0,5).map(card).join("")||'<p class="muted">Belum ada job.</p>'}
function renderJobs(){let q=($("search").value||"").toLowerCase();$("jobList").innerHTML=jobs.filter(x=>(x.title+" "+x.job_code+" "+(x.description||"")).toLowerCase().includes(q)).map(card).join("")||'<p class="muted">Tidak ada job.</p>'}
function renderHistory(){$("historyList").innerHTML=jobs.filter(x=>x.status==="completed").map(card).join("")||'<p class="muted">Belum ada pekerjaan selesai.</p>'}
function renderUsers(){$("userList").innerHTML=profiles.map(x=>`<div class="item"><b>${esc(x.full_name||"-")}</b><br>${esc(x.email||"")}<br><span class="badge">${x.role}</span></div>`).join("")||"Belum ada user."}
$("loginBtn").onclick=async()=>{ $("loginMsg").textContent="Memproses...";let r=await client.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(r.error){$("loginMsg").textContent=r.error.message;return}await enter(r.data.user)}
$("logoutBtn").onclick=async()=>{await client.auth.signOut();location.reload()};$("search").oninput=renderJobs;
$("addBtn").onclick=async()=>{let r=await client.from("tasks").insert({title:$("title").value.trim(),description:$("desc").value,priority:$("priority").value,task_date:$("taskDate").value||null,deadline:$("deadline").value?new Date($("deadline").value).toISOString():null,notes:$("notes").value,created_by:me.id}).select().single();if(r.error){$("addMsg").textContent=r.error.message;return}$("addMsg").textContent="Job berhasil disimpan.";await load();show("jobs")}
async function startJob(id){let r=await client.from("tasks").update({status:"in_progress",started_at:new Date().toISOString(),started_by:me.id}).eq("id",id);if(r.error)alert(r.error.message);await load();renderJobs();renderDashboard()}
async function completeJob(id){let result=prompt("Masukkan hasil pekerjaan:");if(result===null)return;let r=await client.from("tasks").update({status:"completed",completed_at:new Date().toISOString(),completed_by:me.id,result_notes:result}).eq("id",id);if(r.error)alert(r.error.message);await load();renderHistory();renderDashboard()}
(async()=>{let r=await client.auth.getSession();if(r.data.session)await enter(r.data.session.user)})()
</script></body></html>
